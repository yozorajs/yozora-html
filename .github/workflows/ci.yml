# This workflow will do a clean install of node dependencies, build the source
# code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - name: Use Node.js 24 for build and test tools
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test build output
        run: pnpm test:build --sourcemap
      - name: Production build
        run: pnpm build:production
      - name: Test
        run: pnpm test:coverage
      - name: Use Node.js ${{ matrix.node }} for runtime checks
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test production output
        run: pnpm test:build --no-sourcemap
